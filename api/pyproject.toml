[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roundup-api"
version = "0.1.0"
description = "RoundUp HTTP API (FastAPI): validates input, calls the engine, never calculates"
requires-python = ">=3.12"
# roundup-engine is a local package (../engine); install it first or use the repo-root requirements-ci.txt (pip) or requirements.txt (Vercel).
dependencies = ["roundup-engine", "fastapi>=0.115", "httpx>=0.27", "pyjwt[crypto]>=2.9"]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6"]

# Explicit package list: tests/ and tests_independent/ are not packages (fixes "Multiple top-level packages
# discovered in a flat-layout").
[tool.setuptools]
packages = ["roundup_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../engine/src", "tests"]   # tests always run the working tree, installed or not
