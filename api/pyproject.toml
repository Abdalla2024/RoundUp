[project]
name = "roundup-api"
version = "0.1.0"
description = "RoundUp HTTP API (FastAPI): validates input, calls the engine, never calculates"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "httpx>=0.27", "pyjwt[crypto]>=2.9"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../engine/src", "../engine/tests"]
