- main:
  - heading "Privacy" [level=1]
  - paragraph:
    - strong: This is an invite-only educational demo.
    - text: This page summarises what happens to your information.
  - heading "What we keep" [level=2]
  - list:
    - listitem: "If you sign in: your email address, used only to send sign-in links (handled by Supabase)."
    - listitem: "If you save a scenario: its settings and results. Your purchases are saved only if you tick the box to save them, and merchant names are never saved."
  - heading "What we don’t keep" [level=2]
  - list:
    - listitem: Uploaded CSV files are read to find your purchases and then discarded. They are never stored.
    - listitem: Simulations you run without signing in are not stored.
    - listitem: We don’t use advertising or third-party trackers.
  - heading "Deleting your data" [level=2]
  - paragraph: You can delete any saved scenario at any time. To delete your account, contact the person who invited you. Saved scenarios are not backed up, so deleted data is gone straight away.
  - paragraph: Plain-language summary for the demo; not reviewed by a lawyer (owner decision for an invite-only demo).
- contentinfo:
  - text: RoundUp is an educational demo. No money moves and nothing here is advice or a forecast.
