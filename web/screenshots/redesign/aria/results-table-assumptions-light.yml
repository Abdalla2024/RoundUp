  - paragraph:
    - strong: "Lowest point compared with money put in:"
    - text: on Nov 6, 2017 the value was $500.83, which was $242.17 below the $743.00 of round-ups added by then.
  - paragraph: On the last day, $3.50 of round-ups was waiting to be invested and $0.00 of dividends was kept as cash. Money was invested 521 times from round-ups and 40 times from dividends.
  - heading "Questions about these numbers" [level=2]
  - paragraph:
    - strong: "Coming later:"
    - text: an AI explainer that only describes these numbers. It will never predict or advise.
  - button "Sign in to save"
  - link "Compare with another way of investing":
    - /url: /compare
  - group: Technical details
  - complementary:
    - region "Key points":
      - heading "Key points" [level=2]
      - list:
        - listitem:
          - strong: Made-up prices.
          - text: The scenario is invented. It is not a real fund or a real market.
        - listitem:
          - strong: Not a forecast.
          - text: It says nothing about what any market will do.
        - listitem:
          - strong: No fees included.
          - text: Real round-up apps may charge fees that matter a lot for small balances.
        - listitem:
          - strong: Not advice.
          - text: Nothing here suggests what you should do with your money.
      - group:
        - text: All assumptions (12)
        - term: Round-ups
        - definition: Each purchase is rounded up to the next whole dollar; the spare change is set aside.
        - term: Whole-dollar purchases
        - definition: A purchase of an exact dollar amount, like $4.00, adds nothing.
        - term: What counts as a purchase
        - definition: Card payments, transfers, cash withdrawals, fees and refunds never create round-ups. Rows are sorted automatically from their type and description.
        - term: When money is invested
        - definition: Saved-up round-ups are bought at the closing price of the next trading day after they are ready, never at a price from before the purchase.
        - term: Starting setting for timing
        - definition: Round-ups start out set to be invested once they add up to $5.00. Investing after every purchase day, weekly or monthly are equally valid to explore.
        - term: Prices
        - definition: Purchases use each simulated day's closing price from the scenario, never adjusted afterwards.
        - term: Dividends
        - definition: Dividends are reinvested on the day they are paid, unless you turn this off. Until then they count at face value.
        - term: Fractional shares
        - definition: Small amounts buy part of a share, so every cent is invested.
        - term: Running costs
        - definition: Treated as already included in the scenario's prices, as a real fund's costs would be, so nothing more is subtracted.
        - term: Costs not included
        - definition: Trading costs, app subscription fees and account fees are not included. Real apps may charge fees that matter a lot for small balances.
        - term: One possible path
        - definition: A made-up scenario shows one possible path, not what any market will do.
        - term: Synthetic scenarios
        - definition: Synthetic scenario. Not a real fund, not real prices, and not a forecast. Scenarios are generated by a published, seeded model.
        - paragraph: Hypothetical simulation on a synthetic market. No money is invested, the prices are not real, and these results are not a forecast or financial advice. Taxes, inflation and interest on uninvested cash are not included.
        - group: Rule references
- contentinfo:
  - text: RoundUp is an educational demo. No money moves and nothing here is advice or a forecast.
  - link "Privacy":
    - /url: /privacy
  - text: ·
  - link "How this works":
    - /url: /how
