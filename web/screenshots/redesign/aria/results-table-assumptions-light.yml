    - heading "Value over time" [level=2]
    - group "Value over time. To read values with the keyboard, select the chart, then use the arrow keys, Home, End, Page Up and Page Down.":
      - img "Value over time": 2015 2016 2017 2018 2019 2020 2021 2022 2023 2024 $0 $1,500 $3,000 $4,500 $5,000
    - paragraph
    - text: Chart shows daily values for ranges up to 366 days and one value per week (the week's last trading day) for longer ranges. All figures are calculated daily. Scenario dates follow a real calendar, but the prices are made up.
