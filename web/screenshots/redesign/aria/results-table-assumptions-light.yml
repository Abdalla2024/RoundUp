  - 'button "Colour theme: the system setting. Change to light."'
  - paragraph: Synthetic scenario. Not a real fund, not real prices, and not a forecast.
- main:
  - heading "Your sample round-ups in a made-up market" [level=1]
  - list "Simulation settings":
    - listitem: 5,217 sample purchases
    - listitem: Crash and recovery, broad-market style
    - listitem: Invest each time round-ups reach $5
    - listitem: Dividends reinvested
    - listitem: Jan 2, 2015 – Dec 31, 2024
    - listitem:
      - link "Edit settings":
        - /url: /
  - paragraph: "Estimate: 10 purchases a week, each with a round-up of $0.50. Real spending varies."
  - note:
    - paragraph:
      - strong: Hypothetical simulation on a synthetic market.
      - text: These results show how sample round-ups behave in a made-up market scenario. No money was invested, the prices are not real, and this is not a forecast. It is not investment, tax or financial advice.
  - region "Result":
    - paragraph: Value at the end, Dec 31, 2024
    - text: $4,295.37
    - paragraph:
      - text: In this made-up scenario,
      - strong: $2,608.50
      - text: of sample round-ups ends at
      - strong: $4,295.37
      - text: "on Dec 31, 2024:"
      - strong: $1,686.87
      - text: more than was put in.
  - term:
    - button "Round-ups added"
  - definition: $2,608.50 from 5,217 sample purchases
  - term:
    - button "Value at end"
  - definition: $4,295.37 on Dec 31, 2024
  - term:
    - button "Dividends (simulated)"
  - definition: $270.54 40 payments reinvested
  - term:
    - button "Growth on round-ups"
  - definition: +$1,686.87 compared with the round-ups added
  - figure "What the end value is made of":
    - strong: What the end value is made of
    - 'img "What the end value is made of: Invested in shares $4,291.87, Round-ups waiting to be invested $3.50, Dividends kept as cash $0.00, Dividends not yet paid $0.00."'
