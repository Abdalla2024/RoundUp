  - paragraph: Synthetic scenario. Not a real fund, not real prices, and not a forecast.
- main:
  - heading "How this works" [level=1]
  - paragraph: RoundUp rounds each sample or uploaded purchase up to the next dollar and invests the spare change in a made-up market scenario, using published rules. Every number is calculated by the RoundUp engine; this site only displays it.
  - paragraph: The scenarios come from a published, seeded model, so the same settings always give the same numbers. They are not real funds or real prices, and they are not forecasts.
  - region "Key points":
    - heading "Key points" [level=2]
    - list:
      - listitem:
        - strong: Made-up prices.
        - text: The scenario is invented. It is not a real fund or a real market.
      - listitem:
        - strong: Not a forecast.
        - text: It says nothing about what any market will do.
      - listitem:
        - strong: No fees included.
        - text: Real round-up apps may charge fees that matter a lot for small balances.
      - listitem:
        - strong: Not advice.
        - text: Nothing here suggests what you should do with your money.
    - group: All assumptions (12)
- contentinfo:
  - text: RoundUp is an educational demo. No money moves and nothing here is advice or a forecast.
